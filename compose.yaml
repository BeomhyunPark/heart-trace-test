services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ONGI_POSTGRES_DB:-ongi}
      POSTGRES_USER: ${ONGI_POSTGRES_USER:-ongi}
      POSTGRES_PASSWORD: ${ONGI_POSTGRES_PASSWORD:-ongi-local-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ongi-postgres-data:/var/lib/postgresql/data

volumes:
  ongi-postgres-data:
